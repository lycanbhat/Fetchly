name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev
      - run: cargo test --workspace

  desktop:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: fetchly
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: fetchly
          - os: macos-13
            target: x86_64-apple-darwin
            bin: fetchly
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: fetchly.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev
      - run: cargo build --release -p fetchly -p fetchly-server --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: fetchly-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/${{ matrix.bin }}
            target/${{ matrix.target }}/release/fetchly-server*
            !target/${{ matrix.target }}/release/*.d
            !target/${{ matrix.target }}/release/*.pdb

  web:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: cargo-bins/cargo-binstall@main
      - run: cargo binstall dioxus-cli@0.7.10 --no-confirm
      - run: dx build --platform web --release -p fetchly
      - uses: actions/upload-artifact@v4
        with:
          name: fetchly-web
          path: target/dx/fetchly/release/web/public
